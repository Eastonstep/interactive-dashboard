<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easton's Interactive Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SRI14XklLFvV4716c9rZWb07vP4l8+LHqK0nqukiIAvNwLzeN8tE5YBujzqJLb" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FyoE0rCGIywxV9Hj09c9OIXx1c3nWz1v7PlZYWyWQrXWm/D+2ScQbITxI" crossorigin="anonymous"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>My Interactive Dashboard</h1>
    <p>This dashboard was created by Easton for the WEB-115 course at Wake Tech</p>

    <!-- The <noscript> is for web browsers with JavaScript rendering disabled. -->
    <noscript>Unfortunately, your web browser does not support JavaScript.</noscript>

    <div class="container">
        <div class="row">

            <div class="col" id="weekly-tasks">
                <form id="goal-form">

                    <label for="user-name">Name:</label>
                    <input type="text" id="user-name">

                    <label for="daily-goal">Daily Task Goal:</label>
                    <input type="number" id="daily-goal">
                    
                    <label for="bonus-tasks">Weekly Bonus Tasks:</label>
                    <input type="number" id="bonus-tasks">

                    <button type="submit" id="goal-btn">Calculate</button>

                </form>

                <p id="goal-message"></p>

                <script src="js/task-manager.js"></script>

            </div>

            <div class="col" id="metric-converter">
                <h2>Imperial/Metric Converter</h2>

                <form>
                    <label for="numeric-value">Enter a value:</label>
                    <input type="number" id="numeric-value" step="any">

                    <label for="conversion-type">Choose a conversion:</label>
                    <select id="conversion-type">
                        <option value="inch to centimeter">Inches to Centimeters</option>
                        <option value="foot to centimeter">Feet to Centimeters</option>
                        <option value="yard to meter">Yards to Meters</option>
                        <option value="mile to kilometer">Miles to Kilometers</option>
                        <option value="centimeter to inch">Centimeters to Inches</option>
                        <option value="centimeter to foot">Centimeters to Feet</option>
                        <option value="meter to yard">Meters to Yards</option>
                        <option value="kilometer to mile">Kilometers to Miles</option>
                    </select>

                    <button type="submit" id="convert-button">Convert</button>
                </form>

                <div id="conversion-result"></div>

                <script src="js/metric-converter.js" defer></script>

            </div>
        </div>
    </div>
</body>
</html>
